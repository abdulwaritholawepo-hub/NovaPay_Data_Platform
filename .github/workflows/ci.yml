name: NovaPay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python imports
        run: |
          python -c "import pandas"
          python -c "import requests"
          python -c "import sqlalchemy"
          python -c "import openpyxl"
          python -c "import pyodbc"

      - name: Verify project modules
        run: |
          python -c "import extract.customer_extractor"
          python -c "import extract.transaction_extractor"
          python -c "import extract.merchants_extractor"
          python -c "import transform.customer_transformer"
          python -c "import processing.incremental_loader"